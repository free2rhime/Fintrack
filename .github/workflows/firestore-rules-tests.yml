name: Firestore Security Rules Tests

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'tests/firestore.rules.test.ts'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/firestore-rules-tests.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/firestore.rules.test.ts'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/firestore-rules-tests.yml'
  workflow_dispatch:

jobs:
  test-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore Rules Emulator Tests
        run: npx firebase emulators:exec --only firestore "npm test"
